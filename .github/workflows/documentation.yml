name: Documentazione sistema
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  manual:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-docs.txt
      - run: npm ci --ignore-scripts
      - run: python -m pip install -r scripts/requirements-docs.txt
      - run: npm run docs:check
      - run: npm run docs:pdf
      - uses: actions/upload-artifact@v4
        with:
          name: eyra-manuale-${{ github.sha }}
          path: |
            output/pdf/eyra-manuale-sistema.pdf
            output/pdf/eyra-system.json
          if-no-files-found: error
          retention-days: 90
